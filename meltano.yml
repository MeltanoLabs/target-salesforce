version: 1
send_anonymous_usage_stats: true
project_id: target-salesforce
plugins:
  loaders:
  - name: target-salesforce
    namespace: target_salesforce
    pip_url: -e .
    capabilities:
    - about
    - batch
    - schema-flattening
    - stream-maps
    - structured-logging
    settings_group_validation:
    - - jwt_client_id
      - jwt_username
      - jwt_private_key
    - - client_id
      - client_secret
      - refresh_token
    - - username
      - password
      - security_token
    settings:
    - name: client_id
      kind: string
      description: "OAuth client_id"
    - name: client_secret
      kind: string
      sensitive: true
      description: "OAuth client_secret"
    - name: refresh_token
      kind: string
      sensitive: true
      description: "OAuth refresh_token"
    - name: username
      kind: string
      description: "User/password username"
    - name: password
      kind: string
      sensitive: true
      description: "User/password password"
    - name: security_token
      kind: string
      sensitive: true
      description: "User/password generated security token. Reset under your Account Settings"
    - name: jwt_client_id
      kind: string
      sensitive: true
      description: "JWT bearer: Salesforce Connected/External Client App consumer key (iss claim)."
    - name: jwt_username
      kind: string
      description: "JWT bearer: Salesforce username to impersonate (sub claim)."
    - name: jwt_private_key
      kind: string
      sensitive: true
      description: "JWT bearer: RSA private key PEM matching the cert uploaded to the Connected/External Client App."
    - name: domain
      kind: string
      value: "login"
      description: "Your Salesforce instance domain. Use 'login' (default) or 'test' (sandbox), or Salesforce My domain."
    - name: is_sandbox
      kind: boolean
      description: "DEPRECATED: Use domain. is_sandbox-False = 'login', is_sandbox-True = 'test'"
    - name: action
      kind: options
      options:
      - label: Insert
        value: insert
      - label: Update
        value: update
      - label: Delete
        value: delete
      - label: Hard Delete
        value: hard_delete
      - label: Upsert
        value: upsert
      value: "update"
      description: "How to handle incoming records by default (insert/update/upsert/delete/hard_delete)"
    - name: allow_failures
      kind: boolean
      value: false
      description: "Allows the target to continue persisting if a record fails to commit"
